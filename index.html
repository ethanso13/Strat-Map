<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Map 2027 — Megawide</title>
<link rel="icon" href="assets/megawide-logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="sm-page">

  <header class="sm-head">
    <div class="sm-headline">
      <div class="sm-eyebrow">Corporate — Office of the CEO</div>
      <h1 class="sm-title">Strategy Map 2027</h1>
    </div>
    <div class="sm-meta">
      <span class="sm-meta-k">Horizon</span>
      <span class="sm-meta-v">FY2027</span>
      <span class="sm-meta-k">Owner</span>
      <span class="sm-meta-v">Office of the CEO</span>
    </div>
  </header>

  <div class="sm-divider"></div>

  <div class="sm-rail">
    <div class="sm-rail-gutter"></div>
    <div class="sm-rail-body">
      <span class="sm-sectionlabel">Objectives</span>
      <div class="sm-tools sm-noprint">
        <button type="button" id="btn-toggle-prev" class="sm-btn sm-btn--quiet">Show 2026</button>
        <button type="button" id="btn-toggle-edit" class="sm-btn">Editing — click to lock</button>
        <button type="button" id="btn-save" class="sm-btn">Save</button>
        <button type="button" id="btn-reset" class="sm-btn sm-btn--quiet">Reset</button>
        <button type="button" id="btn-print" class="sm-btn sm-btn--primary">Export PDF</button>
      </div>
    </div>
  </div>

  <!-- bands are rendered by app.js -->
  <div id="bands"></div>

  <div class="sm-divider"></div>

  <footer class="sm-footer">
    <div class="sm-logo-wrap">
      <img class="sm-logo" src="assets/megawide-logo.png" alt="Megawide">
    </div>
  </footer>

</main>

<script src="app.js"></script>
</body>
</html>
