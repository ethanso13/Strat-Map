<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategy Map — Megawide</title>
<link rel="icon" href="assets/megawide-logo.png">
<!-- ?v= busts the browser cache. GitHub Pages serves assets with
     Cache-Control: max-age=600 and its headers can't be configured, so
     without this a deploy can be invisible for ten minutes. Bump on release. -->
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<main class="sm-page">

  <header class="sm-head">
    <div class="sm-headline">
      <div class="sm-eyebrow">Megawide Corporation</div>
      <h1 class="sm-title" id="page-title">Strategy Map 2027</h1>
    </div>
    <div class="sm-meta">
      <span class="sm-meta-k">SBU</span>
      <span class="sm-meta-v" id="sbu">CORP</span>
      <label class="sm-meta-k" for="year">Year</label>
      <select class="sm-year" id="year">
        <option value="prev">FY2026</option>
        <option value="curr">FY2027</option>
      </select>
    </div>
  </header>

  <div class="sm-divider"></div>

  <div class="sm-rail">
    <div class="sm-rail-gutter"></div>
    <div class="sm-rail-body">
      <div class="sm-tools sm-noprint">
        <button type="button" id="btn-reset" class="sm-btn sm-btn--icon sm-btn--quiet"
                aria-label="Reset map to starting template" title="Reset map to starting template">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
        </button>
        <button type="button" id="btn-save" class="sm-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- bands are rendered by app.js -->
  <div id="bands"></div>

  <div class="sm-divider"></div>

</main>

<!-- Shared confirmation modal. Native <dialog> so Esc, focus trapping and the
     backdrop come from the platform rather than being reimplemented. -->
<dialog id="confirm" class="sm-dialog" aria-labelledby="confirm-title">
  <div class="sm-dialog-inner">
    <h2 class="sm-dialog-title" id="confirm-title"></h2>
    <p class="sm-dialog-body" id="confirm-body"></p>
    <div class="sm-dialog-actions">
      <button type="button" class="sm-btn sm-btn--quiet" id="confirm-cancel">Cancel</button>
      <button type="button" class="sm-btn sm-btn--primary" id="confirm-ok"></button>
    </div>
  </div>
</dialog>

<script src="app.js?v=5"></script>
</body>
</html>
