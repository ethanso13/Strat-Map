  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"8690abf7-2e71-4cff-a65e-f68f8d4f6455\"><\u002Fscript>\n<style>\n  body { margin: 0; background: var(--color-bg); }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent); }\n  .sm-in { font: inherit; color: inherit; background: transparent; border: 0; padding: 0; width: 100%; resize: none; outline: none; }\n  .sm-in:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n  textarea.sm-in { field-sizing: content; overflow: hidden; min-height: 1.2em; }\n\n  /* — responsive —\n     The desktop layout is a fixed 1440px canvas whose containers carry inline\n     styles, so every override below needs !important to win the cascade. */\n  @media (max-width: 1180px) {\n    .sm-page { width: 100% !important; padding: 40px 32px 56px !important; }\n  }\n  @media (max-width: 880px) {\n    html, body { overflow-x: hidden; }\n    .sm-page { padding: 24px 16px 40px !important; }\n    .sm-page h1 { font-size: clamp(28px, 8vw, 40px) !important; }\n\n    /* title and meta stack instead of sitting shoulder to shoulder */\n    .sm-head { flex-direction: column !important; align-items: flex-start !important; gap: 14px !important; }\n    .sm-meta { grid-template-columns: auto 1fr !important; gap: 4px 16px !important; padding-bottom: 0 !important; }\n\n    /* drop the 46px gutter that exists only to clear the vertical band label */\n    .sm-rail { grid-template-columns: 1fr !important; gap: 0 !important; }\n    .sm-rail > div:first-child { display: none !important; }\n\n    /* toolbar wraps, buttons get a real touch target */\n    .sm-tools { flex-wrap: wrap !important; gap: 8px !important; width: 100%; }\n    .sm-tools button { flex: 1 1 auto; min-height: 40px; }\n\n    /* band label turns horizontal and sits above its cards */\n    .sm-band { grid-template-columns: 1fr !important; gap: 12px !important; padding: 18px 0 24px !important; }\n    .sm-bandlabel h2 {\n      writing-mode: horizontal-tb !important;\n      transform: none !important;\n      white-space: normal !important;\n      width: 100%; box-sizing: border-box;\n      padding: 9px 12px !important;\n      font-size: 13px !important;\n    }\n\n    /* the two year lanes stack vertically */\n    .sm-lanes, .sm-lane { flex-direction: column !important; gap: 18px !important; }\n\n    /* one objective per row */\n    .sm-cards { grid-template-columns: 1fr !important; gap: 12px !important; }\n    .sm-cards > * { min-height: 76px !important; }\n  }\n  @media (max-width: 520px) {\n    .sm-page { padding: 20px 12px 32px !important; }\n    .sm-tools button { flex: 1 1 100%; }\n  }\n\n  @page { size: A4 landscape; margin: 10mm; }\n  @media print {\n    .sm-noprint { display: none !important; }\n    .sm-page, .sm-card { zoom: 0.60; padding: 0 !important; background: #fff !important; }\n    .sm-card { zoom: 1; padding: 16px !important; }\n    body, html { background: #fff !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"sm-page\" style=\"width: 1440px; margin: 0 auto; padding: 56px 64px 72px; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); box-sizing: border-box;\">\n\n  <div class=\"sm-head\" style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; padding-bottom: 20px;\">\n    <div style=\"max-width: 760px;\">\n      <div style=\"font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-700);\">CORPORATE — OFFICE OF THE CEO<\u002Fdiv>\n      \n      <h1 style=\"font-family: var(--font-heading); font-size: 52px; line-height: 1.02; font-weight: 700; margin: 12px 0 0; letter-spacing: -0.02em; position: relative\">Strategy Map 2027<\u002Fh1>\n    <\u002Fdiv>\n    <div class=\"sm-meta\" style=\"display: grid; grid-template-columns: auto auto; gap: 6px 28px; font-size: 13px; padding-bottom: 6px;\">\n      <span style=\"color: var(--color-neutral-600); text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; font-weight: 700;\">Horizon<\u002Fspan>\n      <span style=\"font-weight: 600;\">FY2027<\u002Fspan>\n      <span style=\"color: var(--color-neutral-600); text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; font-weight: 700;\">Owner<\u002Fspan>\n      <span style=\"font-weight: 600;\">Office of the CEO<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height: 2px; background: var(--color-divider);\"><\u002Fdiv>\n\n  <div class=\"sm-rail\" style=\"display: grid; grid-template-columns: 46px 1fr; gap: 20px; padding: 14px 0 10px; align-items: center;\">\n    <div><\u002Fdiv>\n    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 20px;\">\n      <span style=\"font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; color: var(--color-neutral-600);\">Objectives<\u002Fspan>\n      <div class=\"sm-noprint sm-tools\" style=\"display: flex; gap: 10px;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ togglePrev }}\" style=\"font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; cursor: pointer; background: transparent; border: 2px solid var(--color-neutral-300); padding: 6px 12px; color: var(--color-neutral-600);\" style-hover=\"{{ editBtnHover }}\">{{ prevToggleLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ toggleEdit }}\" style=\"font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; cursor: pointer; background: transparent; border: 2px solid var(--color-text); padding: 6px 12px; color: var(--color-text);\" style-hover=\"{{ editBtnHover }}\">{{ editLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ saveNow }}\" style=\"font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; cursor: pointer; background: transparent; border: 2px solid var(--color-text); padding: 6px 12px; color: var(--color-text);\" style-hover=\"{{ editBtnHover }}\">{{ saveLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ resetMap }}\" style=\"font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; cursor: pointer; background: transparent; border: 2px solid var(--color-neutral-300); padding: 6px 12px; color: var(--color-neutral-600);\" style-hover=\"{{ editBtnHover }}\">Reset<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ exportPdf }}\" style=\"font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; cursor: pointer; background: var(--color-accent); border: 2px solid var(--color-accent); padding: 6px 12px; color: #fff;\" style-hover=\"{{ pdfBtnHover }}\">Export PDF<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-for list=\"{{ bands }}\" as=\"band\" hint-placeholder-count=\"4\">\n    <div style=\"border-top: 2px solid var(--color-divider);\">\n      <sc-if value=\"{{ band.connector }}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"sm-rail\" style=\"display: grid; grid-template-columns: 46px 1fr; gap: 20px; height: 0;\">\n          <div style=\"width: 46px;\"><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-around;\">\n            \n            \n            \n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div class=\"sm-band\" style=\"display: grid; grid-template-columns: auto 1fr; gap: 20px; padding: 26px 0 30px; align-items: stretch;\">\n        <div class=\"sm-bandlabel\" style=\"display: flex;\">\n          <h2 style=\"align-self: stretch; background: var(--color-accent); color: #fff; font-family: var(--font-heading); font-size: 16px; line-height: 1.15; font-weight: 700; letter-spacing: 0.08em; margin: 0; padding: 14px 10px; text-transform: uppercase; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap;\">{{ band.name }}<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"sm-lanes\" style=\"display: flex; gap: 28px; align-items: stretch;\">\n        <sc-for list=\"{{ band.lanes }}\" as=\"lane\" hint-placeholder-count=\"2\">\n        <div class=\"sm-lane\" style=\"flex: 1 1 0; min-width: 0; display: flex; gap: 28px;\">\n        <div style=\"flex: 1 1 0; min-width: 0;\">\n        <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px;\">\n          <span style=\"font-family: var(--font-heading); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-neutral-600);\">{{ lane.label }}<\u002Fspan>\n          <sc-if value=\"{{ lane.canCopyAll }}\" hint-placeholder-val=\"{{ false }}\">\n            <button class=\"sm-noprint\" type=\"button\" sc-camel-on-click=\"{{ lane.onCopyAll }}\" style=\"cursor: pointer; background: transparent; border: 0; padding: 0; font: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-700);\" style-hover=\"{{ addHover }}\">{{ lane.copyAllLabel }}<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div class=\"sm-cards\" style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; align-items: stretch;\">\n          <sc-for list=\"{{ lane.cells }}\" as=\"cell\" hint-placeholder-count=\"2\">\n            <div class=\"sm-card\" style=\"border: 2px solid var(--color-text); background: #fff; padding: 16px; min-height: 104px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;\">\n              <div style=\"display: flex; gap: 8px; align-items: flex-start;\">\n                <textarea class=\"sm-in\" rows=\"2\" value=\"{{ cell.title }}\" sc-camel-on-change=\"{{ cell.onTitle }}\" sc-camel-read-only=\"{{ locked }}\" placeholder=\"Objective\" style=\"font-family: var(--font-heading); font-size: 17px; line-height: 1.18; font-weight: 700; letter-spacing: -0.01em;\"><\u002Ftextarea>\n                <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button type=\"button\" title=\"Delete objective\" sc-camel-on-click=\"{{ cell.onRemove }}\" style=\"flex: 0 0 auto; cursor: pointer; background: transparent; border: 0; padding: 0 0 0 4px; font-size: 15px; line-height: 1; color: var(--color-neutral-500);\" style-hover=\"{{ delHover }}\">×<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <sc-if value=\"{{ cell.hasItems }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding-top: 10px; border-top: 2px solid var(--color-divider); display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.35; color: var(--color-neutral-700);\">\n                  <div style=\"font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--color-neutral-500);\">Measure<\u002Fdiv>\n                  <sc-for list=\"{{ cell.items }}\" as=\"item\" hint-placeholder-count=\"3\">\n                    <div style=\"display: flex; gap: 8px; align-items: flex-start;\">\n                      <textarea class=\"sm-in\" rows=\"1\" value=\"{{ item.text }}\" sc-camel-on-change=\"{{ item.onText }}\" sc-camel-read-only=\"{{ locked }}\" placeholder=\"Measure\" style=\"flex: 1 1 auto; line-height: 1.35;\"><\u002Ftextarea>\n                      <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ true }}\">\n                        <button type=\"button\" title=\"Delete measure\" sc-camel-on-click=\"{{ item.onRemove }}\" style=\"flex: 0 0 auto; cursor: pointer; background: transparent; border: 0; padding: 0; font-size: 13px; line-height: 1; color: var(--color-neutral-500);\" style-hover=\"{{ delHover }}\">×<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"sm-noprint\" style=\"margin-top: auto; display: flex; gap: 14px; align-items: center; padding-top: 6px;\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ cell.onAddItem }}\" style=\"cursor: pointer; background: transparent; border: 0; padding: 0; font: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--color-neutral-500);\" style-hover=\"{{ addHover }}\">+ Measure<\u002Fbutton>\n                  <sc-if value=\"{{ cell.canCopy }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button type=\"button\" title=\"Copy this objective forward\" sc-camel-on-click=\"{{ cell.onCopy }}\" style=\"cursor: pointer; background: transparent; border: 0; padding: 0; font: inherit; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--color-accent-700);\" style-hover=\"{{ addHover }}\">{{ cell.copyLabel }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ true }}\">\n            <button class=\"sm-noprint\" type=\"button\" sc-camel-on-click=\"{{ lane.onAdd }}\" style=\"cursor: pointer; border: 2px dashed var(--color-neutral-300); background: transparent; min-height: 104px; display: flex; align-items: center; padding: 16px; font: inherit; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: var(--color-neutral-500); text-align: left;\" style-hover=\"{{ slotHover }}\">+ Add objective<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lane.isPrev }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"width: 2px; background: var(--color-divider); align-self: stretch;\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n\n  <div style=\"height: 2px; background: var(--color-divider);\"><\u002Fdiv>\n  <div style=\"margin-top: 24px; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 32px; background-color: #FFFFFF\">\n    <div style=\"display: flex; align-items: center; gap: 12px;\">\n      <div style=\"background: #fff; padding: 8px 14px; display: flex; align-items: center;\">\n        <img src=\"51510363-48c7-4798-b6f6-997a9bace028\" alt=\"Megawide\" style=\"display: block; height: 30px; width: auto;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    \n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;prevYear&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Years&quot;},&quot;currYear&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2027&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Years&quot;},&quot;showArrows&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Display&quot;}}\">\nconst DEFAULT_BANDS = [\n  { abbr: 'FIN', name: 'Finance', question: 'Description', connector: false,\n    cells: [{ title: 'Net Income', items: [{ text: 'NIAT', target: '1.2 Billion' }, { text: 'Book Value', target: '' }, { text: 'Share Price', target: '' }] }] },\n  { abbr: 'BUS', name: 'Business', question: 'Description', connector: true,\n    cells: [{ title: 'Capital Structure Management', items: [] }] },\n  { abbr: 'IBP', name: 'Internal Business Process', question: 'Which processes must we excel at?', connector: true,\n    cells: [{ title: 'Engagement Plan', items: [] }, { title: 'Communications Plan', items: [] }, { title: 'Digitalization', items: [] }, { title: 'Policies and Procedures', items: [] }] },\n  { abbr: 'L&G', name: 'Learning and Growth', question: 'What people and capabilities make those processes possible?', connector: true,\n    cells: [{ title: 'Org Development', items: [] }, { title: 'Leadership and Talent Development', items: [] }, { title: 'Culture Development', items: [] }, { title: 'Learning Curriculum', items: [] }, { title: 'Cadetship Program', items: [] }] }\n];\n\nconst clone = v => JSON.parse(JSON.stringify(v));\nconst STORE_KEY = 'megawide-strategy-map-v2';\n\n/* Supabase cloud sync. The map is stored as a single row (id = 'default') whose\n   `years` jsonb column mirrors this component's `years` state exactly.\n   localStorage is kept as an offline cache so the map still works with no network. */\nconst SB_URL = 'https://bshdkeuvovulcixupwys.supabase.co';\nconst SB_KEY = 'sb_publishable_-5B1hTP7hwIWW_5QkZ_Gvg_qtDXpsir';\nconst SB_REST = SB_URL + '/rest/v1/strategy_map';\nconst SB_ROW = 'default';\nconst sbHeaders = extra => Object.assign({\n  'apikey': SB_KEY,\n  'Authorization': 'Bearer ' + SB_KEY,\n  'Content-Type': 'application/json'\n}, extra || {});\n\nfunction cloudLoad() {\n  return fetch(SB_REST + '?id=eq.' + SB_ROW + '&select=years', { headers: sbHeaders() })\n    .then(r => { if (!r.ok) throw new Error('load ' + r.status); return r.json(); })\n    .then(rows => {\n      if (!rows.length) return null;\n      const y = rows[0].years;\n      // the seeded row starts as {} — treat that as \"nothing stored yet\"\n      return (y && Array.isArray(y.prev) && Array.isArray(y.curr)) ? y : null;\n    });\n}\n\nfunction cloudSave(years) {\n  return fetch(SB_REST + '?on_conflict=id', {\n    method: 'POST',\n    headers: sbHeaders({ 'Prefer': 'resolution=merge-duplicates,return=minimal' }),\n    body: JSON.stringify({ id: SB_ROW, years: years, updated_at: new Date().toISOString() })\n  }).then(r => { if (!r.ok) throw new Error('save ' + r.status); });\n}\n\nclass Component extends DCLogic {\n  state = {\n    years: { prev: DEFAULT_BANDS.map(b => clone(b.cells)), curr: DEFAULT_BANDS.map(() => []) },\n    editing: true,\n    showPrev: false,\n    syncState: 'idle'\n  };\n\n  componentDidMount() {\n    // 1. Paint immediately from the local cache so the map never flashes empty.\n    try {\n      const saved = localStorage.getItem(STORE_KEY);\n      if (saved) {\n        this.setState({ years: JSON.parse(saved) });\n      } else {\n        const v1 = localStorage.getItem('megawide-strategy-map-v1');\n        if (v1) {\n          const bands = JSON.parse(v1);\n          this.setState({ years: { prev: bands.map(b => b.cells || []), curr: bands.map(() => []) } });\n        }\n      }\n    } catch (e) {}\n\n    // 2. Then reconcile against the cloud, which is the source of truth.\n    this.setState({ syncState: 'loading' });\n    cloudLoad().then(years => {\n      if (years) {\n        this.setState({ years: years, syncState: 'synced' });\n        try { localStorage.setItem(STORE_KEY, JSON.stringify(years)); } catch (e) {}\n      } else {\n        // Nothing stored remotely yet — seed it from whatever we have locally.\n        return cloudSave(this.state.years).then(() => this.setState({ syncState: 'synced' }));\n      }\n    }).catch(() => this.setState({ syncState: 'offline' }));\n  }\n\n  save(years) {\n    try { localStorage.setItem(STORE_KEY, JSON.stringify(years)); } catch (e) {}\n    // Debounced so a burst of keystrokes becomes one write.\n    this.setState({ syncState: 'saving' });\n    clearTimeout(this._cloudT);\n    this._cloudT = setTimeout(() => {\n      cloudSave(years)\n        .then(() => this.setState({ syncState: 'synced' }))\n        .catch(() => this.setState({ syncState: 'offline' }));\n    }, 700);\n  }\n\n  componentWillUnmount() {\n    clearTimeout(this._cloudT);\n    clearTimeout(this._savedT);\n  }\n\n  mutate(fn) {\n    this.setState(s => {\n      const years = clone(s.years);\n      fn(years);\n      this.save(years);\n      return { years };\n    });\n  }\n\n  renderVals() {\n    const editing = this.state.editing;\n    const hover = { color: 'var(--color-accent)' };\n    const prevYear = this.props.prevYear ?? '2026';\n    const currYear = this.props.currYear ?? '2027';\n    const laneKeys = this.state.showPrev ? ['prev', 'curr'] : ['curr'];\n    return {\n      editing,\n      locked: !editing,\n      editLabel: editing ? 'Editing — click to lock' : 'Locked — click to edit',\n      toggleEdit: () => this.setState(s => ({ editing: !s.editing })),\n      editBtnHover: { background: 'var(--color-accent)', borderColor: 'var(--color-accent)', color: '#fff' },\n      pdfBtnHover: { background: 'var(--color-accent-600)', borderColor: 'var(--color-accent-600)' },\n      resetMap: () => {\n        if (!window.confirm('Reset the map to the starting template? Your entries will be lost.')) return;\n        const years = { prev: DEFAULT_BANDS.map(b => clone(b.cells)), curr: DEFAULT_BANDS.map(() => []) };\n        this.save(years);\n        this.setState({ years });\n      },\n      saveLabel: (\n        this.state.syncState === 'saving' || this.state.syncState === 'loading' ? 'Syncing…' :\n        this.state.syncState === 'offline' ? 'Offline — saved locally' :\n        this.state.justSaved ? 'Saved to cloud ✓' : 'Save'\n      ),\n      saveNow: () => {\n        // Flush past the debounce so the button writes right away.\n        const years = this.state.years;\n        try { localStorage.setItem(STORE_KEY, JSON.stringify(years)); } catch (e) {}\n        clearTimeout(this._cloudT);\n        this.setState({ syncState: 'saving' });\n        cloudSave(years).then(() => {\n          this.setState({ syncState: 'synced', justSaved: true });\n          clearTimeout(this._savedT);\n          this._savedT = setTimeout(() => this.setState({ justSaved: false }), 1800);\n        }).catch(() => this.setState({ syncState: 'offline' }));\n      },\n      togglePrev: () => this.setState(s => ({ showPrev: !s.showPrev })),\n      prevToggleLabel: this.state.showPrev ? 'Hide ' + prevYear : 'Show ' + prevYear,\n      exportPdf: () => { this.setState({ editing: false }, () => setTimeout(() => window.print(), 60)); },\n      delHover: hover,\n      addHover: hover,\n      slotHover: { borderColor: 'var(--color-accent)', color: 'var(--color-accent-700)' },\n      bands: DEFAULT_BANDS.map((band, bi) => ({\n        abbr: band.abbr,\n        name: band.name,\n        question: band.question,\n        connector: band.connector && (this.props.showArrows ?? true),\n        lanes: laneKeys.map(key => ({\n          key,\n          isPrev: key === 'prev' && this.state.showPrev,\n          label: key === 'prev' ? prevYear + ' — previous' : currYear + ' — current',\n          canCopyAll: key === 'prev' && editing && (this.state.years.prev[bi] || []).length > 0,\n          copyAllLabel: 'Copy all to ' + currYear + ' →',\n          onCopyAll: () => this.mutate(y => { (y.prev[bi] || []).forEach(c => y.curr[bi].push(clone(c))); }),\n          onAdd: () => this.mutate(y => { y[key][bi].push({ title: '', items: [] }); }),\n          cells: (this.state.years[key][bi] || []).map((cell, ci) => ({\n            title: cell.title,\n            hasItems: cell.items.length > 0,\n            canCopy: key === 'prev' && editing,\n            copyLabel: 'Copy to ' + currYear + ' →',\n            onCopy: () => this.mutate(y => { y.curr[bi].push(clone(y.prev[bi][ci])); }),\n            onTitle: e => { const v = e.target.value; this.mutate(y => { y[key][bi][ci].title = v; }); },\n            onRemove: () => this.mutate(y => { y[key][bi].splice(ci, 1); }),\n            onAddItem: () => this.mutate(y => { y[key][bi][ci].items.push({ text: '', target: '' }); }),\n            items: cell.items.map((item, ii) => ({\n              text: item.text,\n              target: item.target || '',\n              onText: e => { const v = e.target.value; this.mutate(y => { y[key][bi][ci].items[ii].text = v; }); },\n              onTarget: e => { const v = e.target.value; this.mutate(y => { y[key][bi][ci].items[ii].target = v; }); },\n              onRemove: () => this.mutate(y => { y[key][bi][ci].items.splice(ii, 1); })\n            }))\n          }))\n        }))\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
